spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ticketforge
    username: ticketforge
    password: ticketforge
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000
  razorpay:
    key-id: ${RAZORPAY_KEY_ID}
    key-secret: ${RAZORPAY_KEY_SECRET}